[project]
name = "grant-capture-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]


dependencies = [
    "google-adk[gcp,otel-gcp,bigquery-analytics]>=2.9.2,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0,<2.0.0",
    "protobuf>=6.31.1,<7.0.0",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "tenacity>=9.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "typer>=0.15",
    "google-cloud-storage>=2.19",
    "google-cloud-secret-manager>=2.22",
    "common-grants-sdk>=0.8.1",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "respx>=0.22",
    "pre-commit>=4.0",
    "codespell>=2.3",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.9.2,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0,<2.0.0"
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["legacy", "docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006", "C408"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app", "ingest", "db", "evals"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge,opps,unparseable"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json,*.json,./legacy/*,legacy/*,./data/cache/*,./reports/*"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"
markers = ["db: needs a Postgres database (TEST_DATABASE_URL)"]

[tool.hatch.build.targets.wheel]
packages = ["app", "ingest", "db", "evals"]


