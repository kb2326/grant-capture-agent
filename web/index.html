<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grant Discovery Agent</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>ADK Search</span>
            </div>
            <h1>Grant Discovery Agent</h1>
            <p class="subtitle">Advanced AI-powered search for federal grants and SBIR opportunities</p>
        </header>
        
        <main>
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="query-input" placeholder="e.g., 'Find NASA SBIR grants for autonomous robotics'" autocomplete="off" />
                    <button id="search-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                </div>
                <div class="suggestions">
                    <span>Try:</span>
                    <button class="suggestion-chip">AI in Healthcare</button>
                    <button class="suggestion-chip">Clean Energy SBIR</button>
                    <button class="suggestion-chip">NASA Robotics</button>
                </div>
            </div>

            <div id="status-indicator" class="hidden">
                <div class="steps">
                    <div class="step" id="step-plan">
                        <div class="step-icon">1</div>
                        <span>Planning</span>
                    </div>
                    <div class="step-line"></div>
                    <div class="step" id="step-exec">
                        <div class="step-icon">2</div>
                        <span>Executing</span>
                    </div>
                    <div class="step-line"></div>
                    <div class="step" id="step-verify">
                        <div class="step-icon">3</div>
                        <span>Verifying</span>
                    </div>
                </div>
                <div class="loading-bar">
                    <div class="loading-progress"></div>
                </div>
                <p id="status-text">Analyzing your request...</p>
            </div>

            <div id="results-area" class="hidden">
                <div class="results-header">
                    <h2>Search Results</h2>
                    <span class="badge" id="result-count">0 Found</span>
                </div>
                <div id="results-content" class="markdown-body">
                    <!-- Results will be injected here -->
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
